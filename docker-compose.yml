# docker compose up --build   ->   http://localhost:8080  (API docs at /scalar/v1)
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ticketflow
      POSTGRES_USER: ticketflow
      POSTGRES_PASSWORD: ticketflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketflow -d ticketflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: Postgres
      Database__SeedDemoData: "true"
      ConnectionStrings__Postgres: Host=postgres;Database=ticketflow;Username=ticketflow;Password=ticketflow
      # Override in real deployments: JWT_SECRET=... docker compose up
      Jwt__Secret: ${JWT_SECRET:-local-compose-secret-change-me-0123456789-abcdef}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
